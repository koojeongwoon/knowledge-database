name: CI - Build and Push Knowledge MCP Server Image

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-knowledge:
    name: Build Knowledge MCP Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/knowledge:latest
            ghcr.io/${{ github.repository_owner }}/knowledge:${{ github.sha }}

      - name: Cleanup old knowledge image versions (Keep latest 3)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'knowledge'
          package-type: 'container'
          min-versions-to-keep: 3
