name: CI - Build and Push Knowledge MCP Server Image

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-knowledge:
    name: Build Knowledge MCP Server (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Generate Image Tag (KST Timestamp)
        id: meta
        run: |
          TAG=$(TZ='Asia/Seoul' date +'%Y%m%d-%H%M')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/knowledge:latest
            ghcr.io/${{ github.repository_owner }}/knowledge:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/knowledge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Retention must preserve every manifest referenced by deployed images.
      # Count-based deletion can remove a tag still used by a k3s workload.
